# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: project1
type: application
framework:
  name: SAPUI5
  version: 1.152.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /sap/opu/odata/sap/ZBS_SALES_V1_SRV
            url: http://tech.sapvista.com:50000
            client: '100'
          - path: /sap/opu/odata/sap/ZAK_SO_SRV
            url: http://tech.sapvista.com:50000
            client: '100'
          - path: /sap/opu/odata/sap/ZEXCEL_API_SRV/
            url: http://tech.sapvista.com:50000
            client: '100'
            
          - path: /sap/opu/odata/sap/ZRK_MARA_V2/
            url: http://tech.sapvista.com:50000
            client: '100'
            
          - path: /sap/opu/odata/sap/API_SALES_ORDER_SRV/
            url: http://tech.sapvista.com:50000
            client: "100"
        
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZBS_SALES_V1_SRV
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZAK_SO_SRV
            metadataPath: ./webapp/localService/ZAK_SO_SRV/metadata.xml
            mockdataPath: ./webapp/localService/ZAK_SO_SRV/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZEXCEL_API_SRV
            metadataPath: ./webapp/localService/ZEXCEL_API_SRV/metadata.xml
            mockdataPath: ./webapp/localService/ZEXCEL_API_SRV/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZRK_MARA_V2
            metadataPath: ./webapp/localService/ZRK_MARA_V2/metadata.xml
            mockdataPath: ./webapp/localService/ZRK_MARA_V2/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/API_SALES_ORDER_SRV
            metadataPath: ./webapp/localService/API_SALES_ORDER_SRV/metadata.xml
            mockdataPath: ./webapp/localService/API_SALES_ORDER_SRV/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/ZRK_MARA_V2/ZRK_MARA_V2_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZRK_MARA_V2_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/API_SALES_ORDER_SRV/API_SALES_ORDER_ANNO_MDL.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='API_SALES_ORDER_ANNO_MDL',Version='0001')/$value/
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
