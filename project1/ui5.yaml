# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: project1
type: application

server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap/opu/odata/sap/ZBS_SALES_V1_SRV
            url: http://tech.sapvista.com:50000
            client: "100"
          - path: /sap/opu/odata/sap/ZAK_SO_SRV
            url: http://tech.sapvista.com:50000
            client: "100"
          - path: /sap/opu/odata/sap/ZEXCEL_API_SRV
            url: http://tech.sapvista.com:50000
            client: "100"
          - path: /sap/opu/odata/sap/ZRK_MARA_V2/
            url: http://tech.sapvista.com:50000
            client: '100'
            destination: s4h
          - path: /sap/opu/odata/sap/API_SALES_ORDER_SRV/
            url: http://tech.sapvista.com:50000
            client: '100'
            destination: s4h

    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300

    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon

builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
